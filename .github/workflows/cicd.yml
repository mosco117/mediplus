name: Build and Push to ECR

on:
  push:
    branches:
      - main
      env:
        AWS_REGION: us-east-1
        ECR_REGISTRY: 267613167594.dkr.ecr.us-east-1.amazonaws.com
        ECR_REPOSITORY: mediplus
        IMAGE_TAG: v1

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 267613167594.dkr.ecr.us-east-1.amazonaws.com

      - name: Build, Tag and Push Docker image to ECR
        run: |
          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          echo "Building Docker image: $IMAGE_URI"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

